# Invoice Ninja on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=invoiceninja
PKG_TITLE="Invoice Ninja"
PKG_DESC="Invoice Ninja, invoicing, quotes, expenses and payments for small businesses and freelancers, in Container Manager with MariaDB — with a DSM window for what's outstanding and overdue (and a DSM notification when an invoice goes overdue), users and their passwords, the mail server that sends your invoices, HTTPS with DSM's certificate, consistent backups and updates."
APP_ID="InvoiceNinja.AppInstance"
REPO=tombruton87/invoiceninja-dsm
SERVICES="app web db"
VOLUMES="public storage db web"
IMAGE_VARS="IN_IMAGE WEB_IMAGE DB_IMAGE"
PORT=8012
PORTS="8012 8013 8022 8212"
HEALTH_PATH=/health
APP_ACTIONS="userpw|usermfa|mailset|mailtest|overdue|refreshcert"
APP_ANSWER_KEYS="ADMIN_EMAIL ADMIN_NAME TLS"
APP_REQUEST_KEYS="EMAIL MAIL_HOST MAIL_PORT MAIL_ENC MAIL_FROM MAIL_FROM_NAME_B64 MAIL_USER_B64 MAIL_PASS_B64 TLS"
TAGLINE="invoicing"
WELCOME="Invoice Ninja sends invoices and quotes, takes payments, tracks expenses and time, and reminds clients who haven't paid. This package runs it with MariaDB in Container Manager — your clients' details and your figures stay on your Synology — makes your account, and adds a window to DSM for what's outstanding and overdue, users, the mail server and HTTPS."
BACKUP_WHAT="the database (a consistent MariaDB dump: clients, invoices, payments, settings), every uploaded logo and document, and the app key that protects stored secrets."
SITE_NOTE="The address you open Invoice Ninja at — and the one in the links your clients get to view and pay invoices, so make it one they can reach (DSM's reverse proxy with a domain). HTTPS can be served directly with DSM's own certificate (Control Panel → Security → Certificate, the system default; renewals are picked up daily) or a self-signed one."
ICON_TOP="#2b2f36"
ICON_BOTTOM="#111317"
ICON_LETTER="I"   # only if icon.png is missing
BETA=yes
